name: luxury-stock-ai-retraining

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/generate_data.py
      - run: python 03_pipeline/src/run_pipeline.py
      - run: python 04_ai/src/train.py
      - run: python 04_ai/src/evaluate.py
      - run: python 04_ai/src/predict.py
      - run: python scripts/generate_reports.py
      - run: python scripts/check_drift.py
      - run: pytest -q
